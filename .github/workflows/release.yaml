name: Release

on:
  workflow_dispatch:
  push:
    paths:
      - version
    branches:
      - main

jobs:
  release:
    name: x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix build .#static
      - run: nix build .#static.releaseSources --out-link release-sources
      - run: echo "tag=v$(<version)" >> "$GITHUB_ENV"
      - run: git tag "${tag}"
      - run: git tag "${tag%.*}"
      - run: git tag "${tag%.*.*}"
      - run: git push --tags --force
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            result/bin/klunok
            release-sources/*
          tag_name: ${{env.tag}}
