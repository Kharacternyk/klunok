name: "Build & Test"

on:
  pull_request:
    paths-ignore:
      - "misc/**"
      - "web/**"
      - version
  push:
    paths-ignore:
      - "misc/**"
      - "web/**"
      - version

jobs:
  build-and-test:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: i686-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-dir = /nix-builds
      - run: sudo mkdir /nix-builds
      - run: findmnt -T /nix-builds
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix flake check --system ${{ matrix.system }}
